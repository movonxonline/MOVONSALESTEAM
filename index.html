        const { useState, useEffect, useRef } = React;

        // --- SISTEM IKON (React Wrapper untuk Lucide HTML) ---
        // Memastikan ikon dirender tanpa conflict dengan Virtual DOM React
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    // Masukkan tag <i> sementara, kemudian suruh Lucide tukarkan jadi SVG
                    iconRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: iconRef.current,
                        attrs: {
                            class: className,
                            width: size,
                            height: size
                        }
                    });
                }
            }, [name, size, className]);

            return <span ref={iconRef} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></span>;
        };

        // Pemetaan (Mapping) nama Ikon supaya sama macam import di React asal
        const Users = (props) => <Icon name="users" {...props} />;
        const Target = (props) => <Icon name="target" {...props} />;

        const ShieldCheck = (props) => <Icon name="shield-check" {...props} />;
        const TrendingUp = (props) => <Icon name="trending-up" {...props} />;
        const BookOpen = (props) => <Icon name="book-open" {...props} />;
        const Calculator = (props) => <Icon name="calculator" {...props} />;

        const Globe = (props) => <Icon name="globe" {...props} />;
        const UserPlus = (props) => <Icon name="user-plus" {...props} />;
        const FileSignature = (props) => <Icon name="file-signature" {...props} />;
        const Share2 = (props) => <Icon name="share-2" {...props} />;
